{% extends "base.html" %}
{% block content %}
<h1>Students</h1>

<form method="get" class="filter-form">
    <label for="q">Cari nama:</label>
    <input id="q" type="text" name="q" value="{{ keyword }}" placeholder="cth: Andi">
    <label for="risk">Risk:</label>
    <select id="risk" name="risk">
        <option value="ALL" {% if selected_risk == "ALL" %}selected{% endif %}>All</option>
        <option value="HIGH_RISK" {% if selected_risk == "HIGH_RISK" %}selected{% endif %}>High Risk</option>
        <option value="MEDIUM_RISK" {% if selected_risk == "MEDIUM_RISK" %}selected{% endif %}>Medium Risk</option>
        <option value="LOW_RISK" {% if selected_risk == "LOW_RISK" %}selected{% endif %}>Low Risk</option>
    </select>
    <button type="submit">Filter</button>
    <a class="btn" href="/students/add">+ Add Student</a>
</form>

<table>
<tr><th>ID</th><th>Name</th><th>Score</th><th>Risk</th><th>Aksi</th></tr>
{% for student in students %}
<tr>
    <td>{{ student.student_id }}</td>
    <td>{{ student.name }}</td>
    <td>{{ "%.2f"|format(student.score) }}</td>
    <td><span class="badge badge-{{ student.risk|lower }}">{{ student.risk }}</span></td>
    <td>
        <form method="post" action="/students/{{ student.student_id }}/delete" onsubmit="return confirm('Hapus {{ student.name }}?')">
            <button type="submit" class="btn-danger">Delete</button>
        </form>
    </td>
</tr>
{% else %}
<tr><td colspan="5">No students found.</td></tr>
{% endfor %}
</table>
{% endblock %}
